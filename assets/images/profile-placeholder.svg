      <stop stop-color="#e7e0e9"/><stop offset=".55" stop-color="#ddd9e1"/><stop offset="1" stop-color="#d7e3e1"/>
    </linearGradient>
    <radialGradient id="p" cx="35%" cy="30%" r="70%">
      <stop stop-color="#f0d7da"/><stop offset=".6" stop-color="#a797c1"/><stop offset="1" stop-color="#666286"/>
